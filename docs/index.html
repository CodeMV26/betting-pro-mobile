<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, 
maximum-scale=1.0, user-scalable=no">
    <title>Betting Pro Mobile</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", 
Roboto, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            color: #1d1d1f;
            text-align: center;
        }
        .container {
            max-width: 420px;
            margin: 50px auto;
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #0071e3; margin-bottom: 10px; font-size: 22px; }
        p { color: #86868b; font-size: 15px; }
        .status {
            display: inline-block;
            padding: 8px 16px;
            background-color: #e3f2fd;
            color: #0d47a1;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 15px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ Betting Pro Mobile</h1>
        <p>v0.11 — Scheletro frontend attivo</p>
        <div class="status">Pronto per il collegamento API</div>
    </div>
</body>
</html>
